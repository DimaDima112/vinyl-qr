<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Прослушивание</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="themeToggle" class="theme-toggle" aria-label="Theme">
    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="4" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2
    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>

  <main class="card">
    <header class="header">
      <p id="genre" class="genre"></p>
      <h1 id="title">Загрузка…</h1>
      <p id="artist"></p>
    </header>

    <div class="record-wrap">
      <div class="record" id="record">
        <div class="cover" id="cover"></div>
        <div class="hole"></div>
      </div>
      <div class="tonearm" id="tonearm">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <circle cx="85" cy="15" r="8" fill="#444" stroke="#222" stroke-width="2"/>
          <line x1="85" y1="15" x2="55" y2="55" stroke="#888" stroke-width="3" stroke-linecap="round"/>
          <circle cx="55" cy="55" r="3" fill="#e8b94a"/>
        </svg>
      </div>
      <button class="play-btn" id="playBtn" aria-label="Play/Pause">
        <svg id="playIcon" viewBox="0 0 24 24" width="28" height="28">
          <path fill="currentColor" d="M8 5v14l11-7z"/>
        </svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" width="28" height="28" style="display:none">
          <path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/>
        </svg>
      </button>
    </div>

    <footer class="info">
      <p id="description"></p>
      <p id="meta" class="meta"></p>
      <div id="similar" class="similar" hidden>
        <span class="similar-label">Похожие исполнители:</span>
        <span id="similar-list"></span>
      </div>
    </footer>

    <audio id="audio" preload="metadata"></audio>
  </main>

  <div id="error" class="error" hidden>
    <p>Диск не найден. Проверь QR-код.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
